plugins {
    id 'java'
    id 'application'
}

group = 'br.unicamp.ic.mc322'
version = '6.0'

repositories {
    mavenCentral()
}

dependencies {
    // Dependências do JUnit 5 (Jupiter) para os testes automatizados
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // Aponta para a classe Main dentro da nova estrutura de pacotes
    mainClass = 'br.unicamp.ic.mc322.Main'
}

// Garante codificação UTF-8 na compilação e na geração do Javadoc
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

// Permite que o Scanner(System.in) funcione normalmente durante o ./gradlew run
run {
    standardInput = System.in
    jvmArgs = ['-Dfile.encoding=UTF-8']
}

// Configura o Gradle para descobrir e rodar os testes com JUnit 5 e exibir o resumo no terminal
tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}