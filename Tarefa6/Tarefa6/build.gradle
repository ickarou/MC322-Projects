plugins {
    id 'java'
    id 'application'
}

group = 'br.unicamp.ic.mc322'
version = '6.0'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 (Jupiter). O BOM fixa as versoes compativeis entre si.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'br.unicamp.ic.mc322.Main'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// ./gradlew test (tambem executado por ./gradlew build)
// Relatorio HTML: build/reports/tests/test/index.html
test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

javadoc {
    options.encoding = 'UTF-8'
}

// Entrada do terminal para o Scanner e UTF-8 tambem na execucao (nao so na compilacao)
tasks.named('run') {
    standardInput = System.in
    jvmArgs = ['-Dfile.encoding=UTF-8']
}
